# Complete SM64 US ROM-only CPU conversion and native platform profile.
# Ordinary CPU text, native OS bodies, RSP programs and data are classified
# by code-inventory.json. The build does not read a reference ELF/map or C tree.
# Common OS and library calls are recognized by tools/native_hooks.toml.
checkpoints = [
  {pc = 0x80246dd8, expected_word = 0x1000ffff, kind = "yield", reason = "Return control to the host on every iteration of SM64's idle loop"},
]

[game]
name = "Super Mario 64 (US)"
rom_sha1 = "9bef1128717f958171a4afac3ed78ee2bb4e86ce"
rom_size = 0x800000
ram_size = 0x400000
entry_symbol = "entry_point"
rom = "../../local/sm64.us.z64"
code_sections = [".main", ".engine", ".goddard"]
boot_sections = [".main"]

[rendering]
# Interpolate display frames while retaining the original game/VI timing.
target_fps = 60

[packaging]
# Native startup loads .main at ROM 0x1000; RT64 only consumes the 64-byte header.
# The hardware IPL3 block is never executed or loaded by this port.
discard = [
  {rom_offset = 0x40, size = 0xfc0, sha256 = "61e88238552c356c23d19409fe5570ee6910419586bc6fc740f638f761adc46e", reason = "IPL3 hardware boot block bypassed by the native bootstrap"},
]

[discovery]
max_functions = 0x2000
max_instructions_per_function = 0x4000
regions = [
  {name = ".main", vram = 0x80246000, rom_offset = 0x1000, size = 0xf4580},
  {name = ".engine", vram = 0x80378800, rom_offset = 0xf5580, size = 0x13490},
  {name = ".goddard", vram = 0x8016f000, rom_offset = 0x21f4c0, size = 0x4a9e0},
]
transfers = [
  {pc = 0x80246030, expected_word = 0x1400008, kind = "tail", targets = [0x80246df8]},
  {pc = 0x80246a94, expected_word = 0x1600008, kind = "jump", targets = [0x80246a9c, 0x80246aac, 0x80246abc, 0x80246acc, 0x80246adc]},
