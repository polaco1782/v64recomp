# 1080 Snowboarding, shared Japanese/US cartridge, header revision 0.
# The cartridge header points at 0x80100400, but the resident kernel's
# original load/execute mapping is ROM 0x1000 -> 0x80000400. The first stub
# clears BSS and jumps to the kernel main at 0x80000460.

[[boundaries]]
symbol = "__osProbeTLB"
vram = 0x80005120
kind = "unsupported_function"
reason = "Privileged TLB probe needs an exact native mapping; fail if the loader reaches it"
expected_words = [0x40085000, 0x310900ff]

# Bootup SDK paths requiring exact CP0/TLB or exception semantics. These remain
# fail-closed until a replay proves one is needed and its complete ABI is mapped.
[[boundaries]]
symbol = "func_801150dc"
vram = 0x801150dc
kind = "unsupported_function"
reason = "Bootup thread yield requires native scheduler dispatch"
expected_words = [0x3c058009, 0x8ca54e80, 0x40086000]

[[boundaries]]
symbol = "func_80115234"
vram = 0x80115234
kind = "unsupported_function"
reason = "Bootup thread dispatch uses CP0 EPC and ERET"
expected_words = [0x3c048009, 0x0c045489, 0x24844e78]

[[boundaries]]
symbol = "func_80117d50"
vram = 0x80117d50
kind = "unsupported_function"
reason = "Bootup TLB probe/read requires exact native mapping"
expected_words = [0x40085000, 0x310900ff, 0x2401e000, 0x00815024]

[[boundaries]]
symbol = "func_8011a7d0"
vram = 0x8011a7d0
kind = "unsupported_function"
reason = "Bootup CP0 Compare timer path needs verified native scheduling"
expected_words = [0x40845800, 0x03e00008, 0x00000000]

[[boundaries]]
symbol = "func_80114ab0"
vram = 0x80114ab0
kind = "unsupported_function"
reason = "Exception-vector preamble jumps into the CP0 exception handler; fail if reached"
expected_words = [0x3c1a8011, 0x275a4ac0]

[[boundaries]]
symbol = "func_80114ac0"
vram = 0x80114ac0
kind = "unsupported_function"
reason = "Exception handler saves CP0 state and returns via privileged dispatch; fail if reached"
expected_words = [0x3c1a8006, 0x275a2850]

[[boundaries]]
symbol = "func_80114ff4"
vram = 0x80114ff4
kind = "unsupported_function"
reason = "RCP exception-event dispatch needs native scheduler exception context; fail if reached"
expected_words = [0x3c0a8006, 0x254a3ed0]

[[boundaries]]
symbol = "func_801150a8"
vram = 0x801150a8
kind = "unsupported_function"
reason = "Coprocessor-unusable exception branch enters the CP0 handler interior; fail if reached"
expected_words = [0x3c013000, 0x01014824]

[[boundaries]]
symbol = "func_80116e90"
vram = 0x80116e90
kind = "unsupported_function"
reason = "SDK Status write needs exact native CP0 semantics; fail if reached"
expected_words = [0x40846000, 0x00000000]

[[boundaries]]
symbol = "func_80116ea0"
vram = 0x80116ea0
kind = "unsupported_function"
reason = "SDK Status read needs exact native CP0 semantics; fail if reached"
expected_words = [0x40026000, 0x03e00008]

[[boundaries]]
symbol = "func_8011d720"
vram = 0x8011d720
kind = "unsupported_function"
reason = "TLB initialization writes CP0 registers and indexed TLB entries; fail if reached"
expected_words = [0x40085000, 0x2409001f]

