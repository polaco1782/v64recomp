# Banjo-Kazooie US revision 0. All offsets below are original cartridge offsets.
hooks = [
  # Handwritten bkGetSR: used by the VI worker to test the pre-NMI mask.
  {symbol = "bkGetSR", vram = 0x8025afe0, kind = "replace_function", handler = "recomp_banjo_get_sr", expected_words = [0x40026000, 0x03e00008, 0x00000000]},
