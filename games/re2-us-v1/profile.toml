# Complete custom watch-register helper. Only disabled watchpoints are supported.
[[hooks]]
symbol = "re2_disable_watch"
vram = 0x800004f0
kind = "replace_function"
handler = "hook_re2_disable_watch"
expected_words = [0x40849000, 0x40809800, 0x03e00008, 0]

# Retire the synthetic IPL thread after the first real priority-zero thread starts.
