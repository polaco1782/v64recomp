  {pc = 0x8015b884, expected_word = 0x00400008, table_vram = 0x80160420, count = 8, sha256 = "0fb5b74f2c2419ad06bd28f5c22605a99d88fc719e14ff8c4cbcfc0e8570deaa"},
  # Movie stream extension type minus one is unsigned <10 at 0x8017d678.
