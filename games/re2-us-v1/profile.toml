  {pc = 0x8015b4b4, expected_word = 0x0040f809, table_vram = 0x80160b4c, count = 6, sha256 = "70976b9caf82a20c617886f19f2c736579484caf58ec9f69fc61e636f9fe48e0"},
  # State 4's two handlers; the following word begins UI geometry.
  {pc = 0x8015d8e4, expected_word = 0x0040f809, table_vram = 0x80160b70, count = 2, sha256 = "f1d93af62572664eff4e791ec237d959235e1bbcb02062e127e282b0ba0e119a"},
