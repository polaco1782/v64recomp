]
roots = [{name = "system_main", vram = 0x8004d344}]

# Startup 0x80000598 selects record 1 through 0x80001180 and inflates it.
# These are cartridge offsets; the .main discovery offset is in the prepared image.
[[discovery.overlays]]
index = 1
record_offset = 0x12ce0
rom_offset = 0x14420
compressed_size = 0x5e1ef
vram = 0x80018a80
size = 0x11e310
section = ".main"
sha256 = "daabf1d4dac248cf697ab7ed60aa1a6e0a555a26a56a154747fbd46b234c6673"

# Runtime loader record 3: the second entry in the reusable thread slot.
[[discovery.overlays]]
index = 3
record_offset = 0x12d00
rom_offset = 0x7688e
compressed_size = 0x237f
vram = 0x8015b030
size = 0x6cc0
section = ".overlay3"
sha256 = "6d9fbcbd1ff19ab43fcf03d18ba554901320c6418b366f4a5576012ac5903352"

[[discovery.overlays]]
