# Sound state 0..3 at 0x80012884, set by 0x80004ab4/4c20/4c5c/4c84.
function_tables = [
  # Overlay 3 states 0..4. The <2 test at 0x8015b08c selects extra drawing,
  # not the dispatch bound. State 1 increments to 2 at 0x8015b478;
  # state 0 selects 3 at 0x8015b218; state 3 increments to 4 at 0x8015d8a8.
  {pc = 0x8015b0b0, expected_word = 0x0040f809, table_vram = 0x80160b38, count = 5, sha256 = "7364503bb2e1c853ec646478a0698f3fdc0706ada024ebbfcb5e514a298fd8fe"},
