# Resident Evil 2 US, header revision 1 (the supplied GoodN64 dump).
[game]
name = "Resident Evil 2 (US, revision 1)"
rom = "../../local/re2.us.rev1.z64"
rom_sha1 = "62ec19bead748c12d38f6c5a7ab0831edbd3d44b"
rom_size = 0x4000000
ram_size = 0x800000
entry_symbol = "entry_point"
code_sections = [".boot", ".main", ".overlay3", ".overlay2"]
boot_sections = [".boot"]

[discovery]
entry_inventory = "startup-entries.json"
allow_registered_indirect_calls = true
regions = [
  {name = ".boot", vram = 0x80000480, rom_offset = 0x1000, size = 0x13420},
  {name = ".main", vram = 0x80018a80, rom_offset = 0x4000000, size = 0x11e310},
  {name = ".overlay3", vram = 0x8015b030, rom_offset = 0x411e310, size = 0x6cc0},
  {name = ".overlay2", vram = 0x8017b410, rom_offset = 0x4124fd0, size = 0xc0a0},
]
# Counts are the unsigned SLTIU bounds before the checked JR, after any
# index bias. Each digest covers the entire table, including default entries.
