# GoldenEye startup overrides; common OS calls use tools/native_hooks.toml.
# Partial startup profile. Checked entries permit registry-based callbacks;
# unvisited bytes and unsupported functions remain reported.
# GoldenEye US region, pinned to the exact ROM supplied for this project.
# All addresses/fingerprints are checked against that ROM; no ELF/map is required.
# This is an initial discovery profile, not a complete CPU inventory yet.
# Common OS and library calls are recognized by tools/native_hooks.toml.
hooks = [
  {symbol = "boot_tlb_install", vram = 0x80000450, kind = "replace_function", handler = "hook_ge_boot_tlb", expected_words = [0x24020001, 0x24030000, 0x24040000]},
  {symbol = "jump_decompressfile", vram = 0x700004f8, kind = "replace_function", handler = "hook_ge_enter_inflate", expected_words = [0x3c077020, 0x24e7141c, 0xe00008]},
  {symbol = "initTLBPrepareContext", vram = 0x70001bb0, kind = "replace_function", handler = "hook_ge_prepare_context", expected_words = [0x24080002, 0x40883000, 0x24080000]},
  {symbol = "osPiRawStartDma", vram = 0x7000cf90, kind = "replace_function", handler = "hook_ge_pi_raw_dma", expected_words = [0x27bdffd8, 0xafbf001c, 0xafa40028]},
  {symbol = "osPiGetStatus", vram = 0x7000d070, kind = "replace_function", handler = "hook_ge_pi_status", expected_words = [0x3c0ea460, 0x3e00008, 0x8dc20010]},
  {symbol = "osInitialize", vram = 0x7000d080, kind = "replace_function", handler = "hook_ge_os_initialize", expected_words = [0x27bdffc0, 0xafbf001c, 0x240e0001]},
  {symbol = "osInvalICache", vram = 0x7000d350, kind = "replace_function", handler = "hook_ge_cache", expected_words = [0x18a00011, 0x0, 0x240b4000]},
  {symbol = "osUnmapTLB", vram = 0x7000d3d0, kind = "replace_function", handler = "hook_ge_unmap_tlb", expected_words = [0x40085000, 0x40840000, 0x3c098000]},
  {symbol = "osViRepeatLine", vram = 0x7000e260, kind = "replace_function", handler = "hook_ge_vi_repeat_line", expected_words = [0x27bdffd8, 0xafbf001c, 0xafa40028, 0xc00617c, 0xafb00018, 0x93ae002b, 0x408025, 0x11c00007, 0x0, 0x3c0f8003, 0x8def8044, 0x95f80000, 0x37190040]},
  {symbol = "__osGetTLBHi", vram = 0x7000e880, kind = "replace_function", handler = "hook_ge_tlb_hi", expected_words = [0x40840000, 0x0, 0x42000001]},
  {symbol = "osSetIntMask", vram = 0x7000dd30, kind = "replace_function", handler = "hook_ge_int_mask", expected_words = [0x400c6000, 0x3182ff01, 0x3c088002]},
  {symbol = "osInvalDCache", vram = 0x70010b20, kind = "replace_function", handler = "hook_ge_cache", expected_words = [0x18a0001f, 0x0, 0x240b2000]},
  {symbol = "osWritebackDCache", vram = 0x70010bd0, kind = "replace_function", handler = "hook_ge_cache", expected_words = [0x18a00011, 0x0, 0x240b2000]},
  {symbol = "osDpGetCounters", vram = 0x7000e3c0, kind = "replace_function", handler = "hook_ge_dp_counters", expected_words = [0x3c0ea410, 0x8dcf0010, 0x3c18a410]},
  {symbol = "osDpSetStatus", vram = 0x7000e4e0, kind = "replace_function", handler = "hook_ge_dp_status", expected_words = [0x3c0ea410, 0x3e00008, 0xadc4000c]},
  {symbol = "osViGetCurrentFramebuffer", vram = 0x7000e410, kind = "replace_function", handler = "hook_ge_vi_framebuffer", expected_words = [0x27bdffd8, 0xafbf001c, 0xc00617c]},
  {symbol = "osViGetNextFramebuffer", vram = 0x7000e450, kind = "replace_function", handler = "hook_ge_vi_framebuffer", expected_words = [0x27bdffd8, 0xafbf001c, 0xc00617c]},
  {symbol = "__osSetCompare", vram = 0x7001f8e0, kind = "replace_function", handler = "hook_ge_set_compare", expected_words = [0x40845800, 0x3e00008, 0x0]},
]
checkpoints = [
  {pc = 0x7000071c, expected_word = 0x1000ffff, kind = "yield", reason = "Yield the original GoldenEye idle loop"},
]

